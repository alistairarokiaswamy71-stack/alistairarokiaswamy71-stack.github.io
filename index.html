<style>

/* =========================================================
   EUROPEAN EDITORIAL / CONSULTING DESIGN SYSTEM
   ========================================================= */

:root{
  --ink:#172437;
  --navy:#10243e;
  --blue:#2457d6;
  --blue-soft:#eaf0fb;
  --muted:#647184;
  --line:#dfe5ec;
  --soft:#f4f6f8;
  --paper:#fbfaf7;
  --white:#ffffff;
}


/* =========================================================
   GLOBAL
   ========================================================= */

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:
    Inter,
    "Helvetica Neue",
    Helvetica,
    Arial,
    sans-serif;

  color:var(--ink);

  background:
    linear-gradient(
      rgba(251,250,247,.96),
      rgba(251,250,247,.96)
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 47px,
      rgba(16,36,62,.035) 48px
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 47px,
      rgba(16,36,62,.035) 48px
    );

  line-height:1.65;
}


/* =========================================================
   EUROPEAN CONTAINER
   ========================================================= */

.container{
  max-width:1120px;
  margin:auto;
  padding:0 32px;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

nav{
  position:sticky;
  top:0;
  z-index:100;

  background:
    rgba(251,250,247,.92);

  backdrop-filter:blur(16px);

  border-bottom:
    1px solid rgba(16,36,62,.12);
}

.nav-inner{
  height:70px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  color:var(--navy);

  font-size:15px;
  font-weight:750;

  letter-spacing:.2px;
}

nav a{
  color:#536174;

  text-decoration:none;

  margin-left:28px;

  font-size:13px;
  font-weight:600;

  transition:.2s ease;
}

nav a:hover{
  color:var(--blue);
}


/* =========================================================
   HERO — EUROPEAN CONSULTING STYLE
   ========================================================= */

.hero{
  position:relative;

  padding:115px 0 105px;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 85% 15%,
      rgba(36,87,214,.08),
      transparent 28%
    ),
    radial-gradient(
      circle at 10% 85%,
      rgba(16,36,62,.045),
      transparent 30%
    ),
    var(--paper);

  border-bottom:
    1px solid var(--line);
}


/* subtle architectural lines */

.hero::before{
  content:"";

  position:absolute;

  top:0;
  right:0;

  width:48%;
  height:100%;

  opacity:.45;

  background:
    repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 69px,
      rgba(16,36,62,.045) 70px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 69px,
      rgba(16,36,62,.045) 70px
    );

  pointer-events:none;
}


/* small European-style coordinate marker */

.hero::after{
  content:"50°N 10°E";

  position:absolute;

  right:45px;
  bottom:35px;

  font-size:10px;
  letter-spacing:2px;

  color:rgba(16,36,62,.25);

  font-weight:700;
}


.hero .container{
  position:relative;
  z-index:2;
}

.eyebrow{
  color:var(--blue);

  font-size:12px;
  font-weight:800;

  text-transform:uppercase;

  letter-spacing:2px;
}

h1{
  font-size:
    clamp(45px,7vw,76px);

  line-height:1.02;

  margin:18px 0 22px;

  letter-spacing:-3px;

  color:var(--navy);

  font-weight:750;
}

.hero h2{
  font-size:22px;

  line-height:1.45;

  font-weight:500;

  color:#34445a;

  max-width:850px;

  margin:0 0 28px;
}

.hero p{
  max-width:760px;

  color:var(--muted);

  font-size:17px;

  line-height:1.8;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.buttons{
  display:flex;

  gap:12px;

  flex-wrap:wrap;

  margin-top:32px;
}

.btn{
  display:inline-block;

  padding:12px 20px;

  border-radius:3px;

  text-decoration:none;

  font-weight:650;

  font-size:13px;

  letter-spacing:.2px;

  transition:
    transform .2s ease,
    background .2s ease,
    color .2s ease;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn.primary{
  background:var(--navy);

  color:white;

  border:
    1px solid var(--navy);
}

.btn.primary:hover{
  background:var(--blue);

  border-color:var(--blue);
}

.btn.secondary{
  background:transparent;

  color:var(--navy);

  border:
    1px solid #bcc6d2;
}


/* =========================================================
   SECTIONS
   ========================================================= */

section{
  position:relative;

  padding:85px 0;

  background:rgba(255,255,255,.72);

  border-bottom:
    1px solid var(--line);
}

section:nth-of-type(even){
  background:
    linear-gradient(
      90deg,
      rgba(244,246,248,.72),
      rgba(251,250,247,.72)
    );
}

.section-label{
  font-size:11px;

  color:var(--blue);

  font-weight:800;

  text-transform:uppercase;

  letter-spacing:2px;
}

h3{
  font-size:34px;

  line-height:1.2;

  margin:12px 0 30px;

  letter-spacing:-1px;

  color:var(--navy);
}

.about{
  font-size:18px;

  color:#425066;

  max-width:870px;

  line-height:1.85;
}


/* =========================================================
   TAGS
   ========================================================= */

.tags{
  display:flex;

  gap:8px;

  flex-wrap:wrap;
}

.tag{
  background:#f5f7fa;

  border:
    1px solid #dce3eb;

  padding:7px 12px;

  border-radius:3px;

  font-size:12px;

  color:#46556a;
}


/* =========================================================
   STANDARD PROJECTS
   ========================================================= */

.project{
  padding:30px 0;

  border-top:
    1px solid var(--line);
}

.project:first-of-type{
  border-top:0;
}

.project h4{
  font-size:21px;

  margin:0 0 5px;

  color:var(--navy);
}

.project .meta{
  font-size:12px;

  color:var(--blue);

  font-weight:750;

  letter-spacing:.3px;

  margin-bottom:12px;
}

.project p{
  color:var(--muted);

  margin:0;

  max-width:920px;
}


/* =========================================================
   FEATURED PROJECT
   ========================================================= */

.project-featured{
  padding:38px 0 45px;

  border-top:
    1px solid var(--line);
}

.project-featured h4{
  font-size:27px;

  line-height:1.3;

  margin:0 0 8px;

  color:var(--navy);

  letter-spacing:-.5px;
}

.project-featured .meta{
  font-size:12px;

  color:var(--blue);

  font-weight:800;

  letter-spacing:.5px;

  margin-bottom:20px;
}

.project-intro{
  color:#536174;

  font-size:16px;

  line-height:1.8;

  max-width:900px;

  margin-bottom:28px;
}

.project-label{
  font-size:11px;

  color:var(--blue);

  font-weight:850;

  text-transform:uppercase;

  letter-spacing:1.8px;

  margin:30px 0 12px;
}


/* =========================================================
   PROJECT GRID
   ========================================================= */

.project-grid{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:16px;

  margin:24px 0;
}

.project-box{
  background:
    rgba(255,255,255,.82);

  border:
    1px solid #dfe5ec;

  border-radius:4px;

  padding:21px;

  box-shadow:
    0 4px 18px rgba(16,36,62,.025);
}

.project-box strong{
  display:block;

  font-size:13px;

  color:var(--navy);

  margin-bottom:7px;
}

.project-box span{
  color:#687589;

  font-size:13px;

  line-height:1.65;
}


/* =========================================================
   PROJECT LIST
   ========================================================= */

.project-list{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:7px 38px;

  padding-left:20px;

  margin-top:8px;
}

.project-list li{
  margin:5px 0;

  color:#5b6879;

  font-size:14px;
}


/* =========================================================
   BUSINESS IMPACT
   ========================================================= */

.project-impact{
  background:
    linear-gradient(
      135deg,
      #f1f4f8,
      #fafbf9
    );

  border-left:
    3px solid var(--blue);

  border-radius:2px;

  padding:22px 25px;

  margin-top:28px;
}

.project-impact strong{
  display:block;

  color:var(--navy);

  margin-bottom:7px;
}

.project-impact p{
  margin:0;

  color:#46556a;

  line-height:1.75;
}


/* =========================================================
   CONFIDENTIALITY NOTE
   ========================================================= */

.confidential-note{
  margin-top:25px;

  padding:13px 16px;

  border:
    1px solid #dfe5ec;

  border-radius:3px;

  font-size:11px;

  line-height:1.6;

  color:#788496;

  background:
    rgba(247,248,250,.8);
}


/* =========================================================
   EXPERIENCE
   ========================================================= */

.experience{
  display:grid;

  grid-template-columns:190px 1fr;

  gap:40px;

  padding:28px 0;

  border-top:
    1px solid var(--line);
}

.experience:first-of-type{
  border-top:0;
}

.date{
  color:#778396;

  font-size:13px;

  font-weight:550;
}

.experience h4{
  margin:0 0 4px;

  font-size:20px;

  color:var(--navy);
}

.company{
  font-weight:750;

  color:#34445a;
}

.experience ul{
  margin-top:15px;
}


/* =========================================================
   QUOTE / PHILOSOPHY
   ========================================================= */

.quote{
  position:relative;

  background:
    linear-gradient(
      135deg,
      #f0f3f7,
      #fafbf9
    );

  border:
    1px solid #dce3eb;

  border-radius:4px;

  padding:38px 42px;

  font-size:21px;

  line-height:1.6;

  color:#34445a;

  box-shadow:
    0 8px 30px rgba(16,36,62,.025);
}

.quote::before{
  content:"“";

  display:block;

  font-size:50px;

  line-height:.7;

  color:var(--blue);

  margin-bottom:15px;
}


/* =========================================================
   CONTACT
   ========================================================= */

#contact{
  background:
    linear-gradient(
      135deg,
      #f2f4f7,
      #fbfaf7
    );
}


/* =========================================================
   FOOTER
   ========================================================= */

footer{
  padding:45px 0;

  color:#788496;

  font-size:12px;

  background:#f1f3f5;

  border-top:
    1px solid var(--line);
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:760px){

  .container{
    padding:0 22px;
  }

  nav .links{
    display:none;
  }

  .hero{
    padding:75px 0 70px;
  }

  .hero::after{
    right:20px;
    bottom:20px;
  }

  section{
    padding:60px 0;
  }

  h1{
    font-size:48px;

    letter-spacing:-2px;
  }

  h3{
    font-size:28px;
  }

  .experience{
    grid-template-columns:1fr;

    gap:8px;
  }

  .project-grid,
  .project-list{
    grid-template-columns:1fr;
  }

  .project-featured h4{
    font-size:23px;
  }

  .quote{
    padding:28px;
    font-size:18px;
  }

}


/* =========================================================
   SUBTLE EUROPEAN SELECTION
   ========================================================= */

::selection{
  background:#dce6fb;

  color:var(--navy);
}


/* =========================================================
   SCROLLBAR
   ========================================================= */

::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-track{
  background:#f1f3f5;
}

::-webkit-scrollbar-thumb{
  background:#b8c2cf;

  border-radius:10px;
}

::-webkit-scrollbar-thumb:hover{
  background:#8f9baa;
}

</style>
